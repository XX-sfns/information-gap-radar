# Keep real values in GitHub Secrets; do not commit a production config file.
project:
  timezone: Asia/Shanghai
  report_limit: 12
llm:
  # Optional, but recommended for the “信息差” module. This uses any OpenAI-compatible API.
  enabled: false
  provider: openai_compatible
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  # Never place the actual key here. Locally use the LLM_API_KEY environment variable;
  # in GitHub Actions create a repository secret named LLM_API_KEY.
  api_key_env: LLM_API_KEY
  max_items_per_run: 8
sources:
  ai_rss:
    - name: OpenAI News
      url: https://openai.com/news/rss.xml
    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
  reddit:
    - subreddit: LocalLLaMA
      query: ""
    - subreddit: SaaS
      query: "pain OR problem OR frustrating"
    - subreddit: startups
      query: "pain OR problem OR wish"
  hackernews_queries:
    - AI agent
    - workflow automation
    - customer support
  # Public question / issue communities provide additional “voice of customer” signals.
  stackexchange_tags:
    - artificial-intelligence
    - llm
    - automation
  github_issue_queries:
    - "is:issue is:open label:bug AI"
    - "is:issue is:open label:enhancement LLM"
  github_queries:
    - topic:ai pushed:>2026-01-01
    - topic:llm pushed:>2026-01-01
    - topic:agent pushed:>2026-01-01
stocks:
  # Yahoo Finance symbols: US: NVDA; China: 600519.SS / 000001.SZ; Hong Kong: 0700.HK
  - symbol: NVDA
    name: NVIDIA
  - symbol: 600519.SS
    name: 贵州茅台
notifications:
  # Choose one or more; values are loaded from environment variables in Actions.
  feishu_webhook_env: FEISHU_WEBHOOK
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  webhook_env: NOTIFY_WEBHOOK
